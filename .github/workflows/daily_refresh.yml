name: Daily Billboard Refresh

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC daily (= 16:00 Taipei)
  workflow_dispatch:        # allow manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Billboard refresh
        run: python pipeline/refresh.py

      - name: Commit updated database
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/charts.db
          git diff --cached --quiet || git commit -m "chore: daily Billboard refresh $(date -u +%Y-%m-%d)"
          git push
